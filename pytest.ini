# ============================================================
# pytest 配置
# ============================================================
[pytest]
# 测试目录
testpaths = tests

# 测试文件命名模式
python_files = test_*.py

# 测试类/函数命名模式
python_classes = Test*
python_functions = test_*

# 输出格式
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# 标记注册
markers =
    slow: 标记慢测试 (CI 中默认运行)
    windows: 标记 Windows 专属测试
    network: 标记需要网络连接的测试 (CI 中跳过)
