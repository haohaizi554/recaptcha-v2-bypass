# ============================================================
# ruff 配置 — Python 代码质量检查
# ============================================================
# 文档: https://docs.astral.sh/ruff/configuration/
#
# 设计原则:
#   - 覆盖项目所有 .py 文件 (排除 .venv / __pycache__ / data)
#   - 启用常用规则集 (pyflakes + pycodestyle + import 排序)
#   - 不启用激进的格式化规则 (避免与现有代码风格冲突)
#   - 忽略 E501 (行长度): 项目含长 URL 和中文注释, 强制截断会降低可读性
# ============================================================

target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "extensions",
    "build",
    "dist",
]

[lint]
# 启用的规则集:
#   E   — pycodestyle errors
#   W   — pycodestyle warnings
#   F   — pyflakes (未使用变量/导入等)
#   I   — isort (导入排序)
#   UP  — pyupgrade (现代化语法)
#   B   — flake8-bugbear (常见 bug 模式)
#   SIM — flake8-simplify (代码简化建议)
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

# 忽略的规则:
#   E501  — 行过长 (项目含长 URL/中文注释, 不强制截断)
#   E402  — 模块级 import 不在文件顶部 (项目有条件导入模式)
#   B008  — 函数默认值中调用函数 (Do not perform function call in argument defaults)
#   SIM117 — 嵌套 with 语句 (有时需要保持独立 with 以提高可读性)
ignore = ["E501", "E402", "B008", "SIM117"]

[lint.per-file-ignores]
# 测试文件允许使用 assert
"tests/*" = ["S101"]
# GUI 文件: 大量 Qt 信号/槽连接, 允许 lambda
"gui.py" = ["B023"]
# 运行时文件: 允许条件导入和延迟导入
"runtimes/*.py" = ["E402"]

[format]
# 格式化: 双引号, 空格缩进
quote-style = "double"
indent-style = "space"
